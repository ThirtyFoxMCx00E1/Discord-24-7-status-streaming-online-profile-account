# Publishes the docs/ folder as a website on GitHub Pages (https://<user>.github.io/<repo>/).
# One-time setup: repo > Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Website (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Check the site
        run: test -f docs/index.html && python3 -m json.tool docs/config.json > /dev/null && du -sh docs
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: docs
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages
      - name: Retry deploy (artifact list can lag a few seconds)
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live on YouTube</title>
<meta name="description" content="Watch the stream, subscribe or join the channel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-top: #1b1230;
  --bg-bottom: #0e0a19;
  --panel: #211838;
  --line: #3d3162;
  --text: #f3effb;
  --muted: #aaa1c6;
  --live: #ff4d5e;
  --btn: #2f2550;
  --btn-hover: #3c3066;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--bg-bottom); }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--text);
  background: linear-gradient(180deg, var(--bg-top), var(--bg-bottom) 70%);
}
main { width: 100%; max-width: 640px; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
}
.live {
  margin: 0 0 6px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 0.95rem;
}
.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--live);
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 77, 94, 0.55); }
  50% { box-shadow: 0 0 0 7px rgba(255, 77, 94, 0); }
}
h1 {
  margin: 0 0 16px;
  font-size: clamp(1.6rem, 6vw, 2.4rem);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.video {
  aspect-ratio: 16 / 9;
  border-radius: 10px;
  overflow: hidden;
  background: #000;
}
.video iframe { width: 100%; height: 100%; border: 0; display: block; }
.actions { display: flex; gap: 10px; margin-top: 16px; }
.actions a {
  flex: 1;
  text-align: center;
  padding: 12px 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--btn);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  text-decoration: none;
}
.actions a:hover { background: var(--btn-hover); }
.actions a.primary { background: var(--text); color: #1b1230; border-color: var(--text); }
.actions a.primary:hover { background: #fff; }
a:focus-visible { outline: 3px solid #b9a4ff; outline-offset: 2px; }
footer { margin-top: 16px; text-align: center; font-size: 0.85rem; color: var(--muted); }
footer a { color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
</head>
<body>
<main>
  <article class="card">
    <p class="live"><span class="dot" aria-hidden="true"></span>Live on YouTube</p>
    <h1 id="title">Streaming now</h1>
    <div class="video"><iframe id="player" title="YouTube video" loading="lazy"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
    <nav class="actions" id="actions" aria-label="Channel links"></nav>
  </article>
  <footer id="foot"></footer>
</main>
<script>
// Edit docs/config.json to change the video, title and channel.
var DEFAULTS = { title: "Streaming now", video: "feeQHBrvLiE", channel: "", repo: "" };

function render(c) {
  var video = encodeURIComponent(c.video);
  var channel = (c.channel || "").replace(/\/+$/, "");
  document.getElementById("title").textContent = c.title;
  document.title = c.title + " - Live on YouTube";
  document.getElementById("player").src = "https://www.youtube-nocookie.com/embed/" + video;

  var links = [["Watch", "https://www.youtube.com/watch?v=" + video, "primary"]];
  if (channel) {
    links.push(["Subscribe", channel + "?sub_confirmation=1", ""]);
    links.push(["Join", channel + "/join", ""]);
  }
  var box = document.getElementById("actions");
  links.forEach(function (l) {
    var a = document.createElement("a");
    a.textContent = l[0];
    a.href = l[1];
    a.target = "_blank";
    a.rel = "noopener";
    if (l[2]) a.className = l[2];
    box.appendChild(a);
  });

  if (c.repo) {
    var f = document.getElementById("foot");
    var a = document.createElement("a");
    a.href = c.repo; a.textContent = "Source on GitHub"; a.rel = "noopener";
    f.appendChild(a);
  }
}

fetch("config.json", { cache: "no-cache" })
  .then(function (r) { return r.ok ? r.json() : {}; })
  .catch(function () { return {}; })
  .then(function (c) { render(Object.assign({}, DEFAULTS, c)); });
</script>
</body>
</html>
